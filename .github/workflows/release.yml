name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="tiog-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.target }}/release/tiog.exe" "dist/$name/tiog.exe"
            cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/$name/*' -DestinationPath 'dist/$name.zip' -Force"
            exit 0
          fi
          cp "target/${{ matrix.target }}/release/tiog" "dist/$name/tiog"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C "dist/$name" .
      - uses: actions/upload-artifact@v4
        with:
          name: tiog-${{ matrix.target }}
          path: |
            dist/tiog-${{ matrix.target }}.tar.gz
            dist/tiog-${{ matrix.target }}.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cp ../scripts/install.sh install.sh
          cp ../scripts/uninstall.sh uninstall.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/install.sh
            dist/uninstall.sh
