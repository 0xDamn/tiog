# tiog configuration — copy to ~/.config/tiog/config.yaml
# Every field is optional; omitted fields fall back to the defaults shown here.
# tiog honors $XDG_CONFIG_HOME; otherwise it reads ~/.config/tiog/config.yaml.

model:
  provider: anthropic              # anthropic | openai | openai-compatible
  name: claude-sonnet-4-6
  api_key_env: ANTHROPIC_API_KEY   # tiog reads your key from THIS env var, never the file
  base_url: null                   # required for openai-compatible (e.g. DeepSeek, Ollama)

context:
  source: auto                     # auto | tmux | hooks
  history_lines: 40                # how many recent commands / lines of context to include
  redact: true                     # scrub secrets from context before sending

behavior:
  auto_run: "off"                  # reserved for optional shell integrations; quote it

router:
  enabled: true                    # model-routes requests to plugins; falls back to command
  default_plugin: command
  min_confidence: 0.55

# Built-ins exist even when omitted:
# - command: shell command suggestions, includes terminal context + conversation memory
# - translator: text translation, context-free by default
plugins:
  translator:
    description: "Translate text between human languages."
    output: text                   # text | command
    include_context: false
    include_conversation: false
    system_prompt: |
      Translate faithfully. Preserve technical terms when appropriate.
