# tiog configuration — copy to ~/.config/tiog/config.yaml
# Every field is optional; omitted fields fall back to the defaults shown here.
# tiog honors $XDG_CONFIG_HOME; otherwise it reads ~/.config/tiog/config.yaml.

model:
  provider: anthropic              # anthropic | openai | openai-compatible
  name: claude-sonnet-4-6
  api_key_env: ANTHROPIC_API_KEY   # tiog reads your key from THIS env var, never the file
  base_url: null                   # required for openai-compatible (e.g. DeepSeek, Ollama)

context:
  source: auto                     # auto | tmux | hooks
  history_lines: 40                # how many recent commands / lines of context to include
  redact: true                     # scrub secrets from context before sending

behavior:
  auto_run: "off"                  # reserved for optional shell integrations; quote it
  output_language: auto            # auto | English | Chinese | Japanese | ...

router:
  enabled: true                    # model-routes requests to plugins; falls back to command
  default_plugin: command
  min_confidence: 0.55

# Built-ins exist even when omitted:
# - command: shell command suggestions, includes terminal context + conversation memory
# - explainer: concepts/errors/output explanation, includes terminal context + conversation memory
# - translator: text translation, includes conversation memory for follow-up references
# - interesting: short curiosity/fact/story for idle waiting time, remembers recent topics
#
# Plugin memory/context switches:
# - include_context: send terminal/session context such as cwd, files, git state, and tmux/hook
#   command output. This can still be disabled per request with --no-context.
# - include_conversation: send recent tiog Q/A memory and record this plugin's response so
#   follow-ups like "translate the previous answer" or "explain that more" work.
plugins:
  explainer:
    description: "Explain concepts, definitions, commands, errors, and terminal output."
    output: text
    include_context: true          # use terminal/session context for errors and command output
    include_conversation: true     # support follow-ups about previous tiog answers
    system_prompt: |
      Explain clearly and briefly. If the request mentions an error, last command, output,
      or session state, use the provided terminal context. Prefer practical terminal-focused
      explanations. Define jargon before using it.

  translator:
    description: "Translate text between human languages."
    output: text                   # text | command
    include_context: false         # translation normally should not need terminal context
    include_conversation: true     # lets "translate the previous answer" work
    system_prompt: |
      Translate faithfully. Preserve technical terms when appropriate. If the request refers
      to previous text with words like "it", "that", "above", or "the previous answer",
      translate the relevant prior tiog response from the recent conversation.

  interesting:
    description: "Share a short, interesting idea, fact, or story for idle waiting time."
    output: text
    include_context: false         # no terminal context needed for idle reading
    include_conversation: true     # avoid repeating recent topics in this tiog session
    system_prompt: |
      The user wants something interesting while they wait. Give one rich but compact
      answer from the humanities or social sciences: sociology, psychology, anthropology,
      history, philosophy, linguistics, literature, political thought, economics, media
      studies, religion, law, education, urban life, or cultural history. Prefer durable
      ideas, social patterns, institutions, concepts, historical episodes, arguments,
      paradoxes, or human behavior over current events. Avoid natural-science-first topics
      such as physics, chemistry, biology, astronomy, geology, and purely technical computing
      unless the user explicitly asks for them or they are needed to explain a human or
      cultural question. If the user gives a topic, use it; otherwise vary domains across
      the humanities and social sciences. Write enough to be satisfying: usually two to four
      short paragraphs, or one paragraph plus a few crisp bullets when structure helps.
      Explain why it is interesting, not just what happened. Avoid topics already shown in
      the recent tiog conversation. Avoid invented specifics, avoid shallow trivia lists,
      and do not mention terminal context, freshness markers, or internal selection details
      unless the user asks for them. Keep it readable during a short wait, but do not
      compress it to a single fact.
